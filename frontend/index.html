        },
        "creator": {

    <script>
      /* Decide the look before the first paint - the theme, the design skin and
         the text size. Without this, a dark-theme user sees a white flash and a
         configured institution sees the default skin for a frame on every load,
         which is exactly what makes an interface feel broken.

         Order of preference for the skin:
           1. the skin this device last used,
           2. the skin in the cached institution configuration (so a college's
              chosen design language applies on the very first frame),
           3. the shipped default.

         The values are duplicated from src/styles/tokens.css on purpose: this
         script has to run before any stylesheet or module has loaded. */
      (function () {
        var root = document.documentElement
        var SHIPPED_SKIN = 'bento'
        var PAPER = { light: '#f8fafc', dark: '#0b1220' }
        try {
          var storedTheme = localStorage.getItem('campusrelay.theme')
          var theme = storedTheme === 'dark' ? 'dark' : 'light'

          var skin =
            localStorage.getItem('campusrelay.skin') || null
          if (!skin) {
            try {
              var cached = JSON.parse(localStorage.getItem('campusrelay.institution') || 'null')
              skin = cached && cached.appearance && cached.appearance.skin
            } catch (inner) {
              skin = null
            }
          }

          root.setAttribute('data-theme', theme)
          root.setAttribute('data-skin', skin || SHIPPED_SKIN)
          root.setAttribute(
            'data-text',
            localStorage.getItem('campusrelay.text') === 'large' ? 'large' : 'normal'
          )
          root.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', PAPER[theme])
        } catch (error) {
          root.setAttribute('data-theme', 'light')
          root.setAttribute('data-skin', SHIPPED_SKIN)
        }
      })()
    </script>
    <style>
      /* ==========================================================================
         PRE-BOOT SCREEN
         A skeleton of the shell that is about to render, in the product's own
         light palette. It paints before any stylesheet loads, so its colours
         cannot come from a variable - they mirror tokens.css by hand. Dark is
         handled explicitly.
         ========================================================================== */
      :root {
        --boot-paper: #f8fafc;
        --boot-surface: #ffffff;
        --boot-line: #e2e8f0;
        --boot-ink: #0f172a;
        --boot-muted: #64748b;
        --boot-signal: #4f46e5;
      }
      html[data-theme='dark'] {
        --boot-paper: #0b1220;
        --boot-surface: #111827;
        --boot-line: #263349;
        --boot-ink: #f1f5f9;
        --boot-muted: #94a3b8;
        --boot-signal: #6366f1;
      }
      html,
      body {
        margin: 0;
        background: var(--boot-paper);
        color: var(--boot-ink);
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        height: 100%;
      }
      #boot {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      .boot-card {
        width: 100%;
        max-width: 380px;
        background: var(--boot-surface);
        border: 1px solid var(--boot-line);
        border-radius: 20px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
        padding: 32px 28px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: boot-in 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }
      @keyframes boot-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: none; }
      }
      .boot-mark {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: var(--boot-signal);
        color: #fff;
        display: grid;
        place-items: center;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: 0.02em;
      }
      .boot-title {
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.01em;
        margin: 0;
      }
      .boot-tagline {
        font-size: 13px;
        color: var(--boot-muted);
        margin: 4px 0 0;
        text-align: center;
      }
      .boot-brand {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .boot-track {
        width: 100%;
        height: 6px;
        border-radius: 999px;
        background: var(--boot-line);
        overflow: hidden;
        position: relative;
      }
      .boot-track span {
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 40%;
        border-radius: 999px;
        background: var(--boot-signal);
        animation: boot-slide 1.4s infinite ease-in-out;
      }
      @keyframes boot-slide {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      .boot-status {
        font-size: 12px;
        color: var(--boot-muted);
        text-align: center;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-card { animation: none; }
        .boot-track span { animation: none; left: 0; width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div class="boot-card">

            <div>

              <p class="boot-tagline">A resilient operating layer for everyday campus operations</p>
            </div>
          </div>
          <div class="boot-track"><span></span></div>
          <div class="boot-status">Loading your campus…</div>
        </div>
      </div>
