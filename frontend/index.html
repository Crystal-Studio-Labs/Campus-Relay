<!doctype html>
<html lang="en" data-skin="industrial">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="A resilient operating layer for everyday campus operations: one case engine, an auditable trail, and an interface that keeps working when the network does not."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Campus Relay" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>Campus Relay</title>
    <script>
      /* Decide the look before the first paint - the theme, the design skin and
         the text size. Without this, a dark-theme user sees a white flash and a
         configured institution sees the default skin for a frame on every load,
         which is exactly what makes an interface feel broken.

         Order of preference for the skin:
           1. the skin this device last used,
           2. the skin in the cached institution configuration (so a college's
              chosen design language applies on the very first frame),
           3. the shipped default.

         The values are duplicated from src/styles/tokens.css on purpose: this
         script has to run before any stylesheet or module has loaded. */
      (function () {
        var root = document.documentElement
        var SHIPPED_SKIN = 'industrial'
        var PAPER = { light: '#f8fafc', dark: '#090d14' }
        try {
          var storedTheme = localStorage.getItem('campusrelay.theme')
          var theme = storedTheme === 'dark' ? 'dark' : 'light'

          var skin =
            localStorage.getItem('campusrelay.skin') || null
          if (!skin) {
            try {
              var cached = JSON.parse(localStorage.getItem('campusrelay.institution') || 'null')
              skin = cached && cached.appearance && cached.appearance.skin
            } catch (inner) {
              skin = null
            }
          }

          root.setAttribute('data-theme', theme)
          root.setAttribute('data-skin', skin || SHIPPED_SKIN)
          root.setAttribute(
            'data-text',
            localStorage.getItem('campusrelay.text') === 'large' ? 'large' : 'normal'
          )
          root.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', PAPER[theme])
        } catch (error) {
          root.setAttribute('data-theme', 'light')
          root.setAttribute('data-skin', SHIPPED_SKIN)
        }
      })()
    </script>
    <style>
      /* Decisive Brutalist Boot Screen */
      html,
      body {
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
        font-family: ui-monospace, 'SFMono-Regular', 'JetBrains Mono', Menlo, monospace;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body {
        background: #090d14;
        color: #f1f5f9;
      }
      #boot {
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 24px;
      }
      #boot .mark {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        background: #ffffff;
        color: #0f172a;
        font-weight: 800;
        font-size: 15px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 12px 20px;
        border-radius: 2px;
        border: 2px solid #334155;
        box-shadow: 3px 3px 0px #0f172a;
      }
      #boot .mark::before {
        content: '';
        width: 14px;
        height: 14px;
        border-radius: 2px;
        background: #1d4ed8;
        border: 1.5px solid #0f172a;
      }
      html[data-theme='dark'] #boot .mark {
        background: #111723;
        color: #f1f5f9;
        border-color: #2e3b52;
        box-shadow: 3px 3px 0px #000000;
      }
      #boot p {
        margin: 18px 0 0;
        font-weight: 700;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #475569;
      }
      html[data-theme='dark'] #boot p {
        color: #94a3b8;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <div>
          <div class="mark">Campus Relay</div>
          <p>Starting the campus operating layer…</p>
        </div>
      </div>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui">
        Campus Relay needs JavaScript enabled. If you are on a kiosk or assisted desk, ask the
        operator to file the request for you.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
