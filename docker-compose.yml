services:
  db:
    image: postgres:16-alpine
    container_name: campus_relay_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus}
      POSTGRES_DB: ${POSTGRES_DB:-campus_relay}
      # Deterministic collation for reproducible ordering in demos/tests.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - campus_relay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus} -d ${POSTGRES_DB:-campus_relay}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional: only needed if we introduce background queues. The prototype runs
  # entirely on Postgres + in-process schedulers, so this is not started by default.
  redis:
    image: redis:7-alpine
    container_name: campus_relay_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    profiles: ["cache"]

volumes:
  campus_relay_pgdata:
